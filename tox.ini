# tox is the single runner for this template's quality gates:
#   tests (across Python versions), lint, type check and docs.
# It is kept intentionally minimal. Add matrices, plugins or extra
# environments once you have started your own project from this template.
#
# The Makefile targets are thin wrappers around `uv run tox -e <env>`,
# so local runs and CI run exactly the same commands.

[tox]
skipsdist = true
envlist = py314, lint, type
requires =
    tox>=4.31
    tox-uv>=1.29.0

[gh-actions]
python =
    3.14: py314
    3.15: py315

[testenv]
description = run the test suite (pytest + coverage)
runner = uv-venv-lock-runner
allowlist_externals = uv
dependency_groups =
    test
commands =
    pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml

[testenv:fix]
description = format and autofix (ruff) - mutates source files
runner = uv-venv-lock-runner
package = skip
commands =
    ruff format src/python_try ./tests
    ruff check --fix src/python_try ./tests

[testenv:lint]
description = lint (ruff, read-only)
runner = uv-venv-lock-runner
package = skip
commands =
    ruff check ./src ./tests

[testenv:type]
description = type check (mypy)
runner = uv-venv-lock-runner
package = skip
commands =
    mypy src/python_try tests

[testenv:docs]
description = build docs; pass `-- gh-deploy --force` to deploy, or `-- serve` to preview
runner = uv-venv-lock-runner
package = skip
dependency_groups =
    docs
commands =
    mkdocs {posargs:build}

[testenv:docs-test]
description = build docs in strict mode (warnings become errors)
runner = uv-venv-lock-runner
# Keep the project importable inside tox's isolated env so mkdocstrings can resolve python_try in CI.
package = editable
dependency_groups =
    docs
commands =
    mkdocs build -s
